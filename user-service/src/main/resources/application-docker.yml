server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres-user:5432/user_db
    username: user_service_user
    password: user_service_pass

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/tcc

tcc:
  security:
    opa:
      enabled: true
      url: http://localhost:8181/v1/data/user/authz/decision
      timeout: 2s
    headers:
      purpose: X-Purpose
      data-subject-id: X-Data-Subject-Id
      correlation-id: X-Correlation-Id