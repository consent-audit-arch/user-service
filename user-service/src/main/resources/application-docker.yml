server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

tcc:
  security:
    enabled: true
    opa:
      enabled: true
      url: ${OPA_URL:http://localhost:8181/v1/data/user/authz/decision}
      timeout: 2s
    pip:
      url: ${TCC_SECURITY_PIP_URL:http://consent-query-service:8080/api/v1/consent}
    headers:
      purpose: X-Purpose
      data-subject-id: X-Data-Subject-Id
      data-category: X-Data-Category
      correlation-id: X-Correlation-Id
